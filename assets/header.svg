<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/><stop offset="0.5" stop-color="#203a43"/><stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <style>
      .t{font:700 44px 'Segoe UI',Arial,sans-serif;fill:#fff;opacity:0;animation:f 1.2s ease forwards}
      .d{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#9fd8f0;opacity:0;animation:f 1.2s ease .6s forwards}
      @keyframes f{to{opacity:1}}
      .w{animation:m 6s ease-in-out infinite alternate}
      @keyframes m{from{transform:translateX(0)}to{transform:translateX(-120px)}}
    </style>
  </defs>
  <rect width="1000" height="200" fill="url(#g)"/>
  <g class="w"><path d="M0 160 Q125 130 250 160 T500 160 T750 160 T1000 160 T1250 160 V200 H0Z" fill="#2ea9df" opacity=".35"/></g>
  <g class="w" style="animation-duration:9s"><path d="M0 175 Q125 150 250 175 T500 175 T750 175 T1000 175 T1250 175 V200 H0Z" fill="#0d1117" opacity=".9"/></g>
  <text x="500" y="85" text-anchor="middle" class="t">Trần Đức Hải</text>
  <text x="500" y="120" text-anchor="middle" class="d">Automation &amp; SCADA Engineer · GoodUseLabs</text>
</svg>
